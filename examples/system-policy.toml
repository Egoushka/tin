# Policy for the device checks D1-D6 (scripts/system-check.py). The six read tools run at once; system__key waits for
# a tap in the approvals app. Fill in the [approvals] table before D3, D5 and D6; without it system__key is refused.

[[allow]]
package = "system"
function = "notifications"

[[allow]]
package = "system"
function = "usage"

[[allow]]
package = "system"
function = "foreground_app"

[[allow]]
package = "system"
function = "screen_text"

[[allow]]                     # a screenshot with numbered boxes, for apps whose screen_text is thin
package = "system"
function = "screen_marks"

[[allow]]
package = "system"
function = "battery"

[[allow]]
package = "system"
function = "connectivity"

[[allow]]                     # a write verb: always held for approval
package = "system"
function = "key"

[[allow]]                     # taps a screen_marks box by number; held for approval
package = "system"
function = "tap_mark"

[notifications]               # one-time codes in notifications are masked as [code]; list apps that may show them
# show_codes = ["com.example.app"]

[approvals]
url = "http://<approvals server tailnet ip>:<port>"
source = "tin"
token_file = "/data/local/tmp/tin/approvals.token"   # the approvals source token for "tin", mode 600
key_file = "/data/local/tmp/tin/approvals.key"       # APPROVAL_HMAC_KEY (at least 32 bytes), mode 600
callback = "https://tin.phone.invalid/approvals/"    # must be a prefix in the server's APPROVALS_CALLBACK_ROUTES
callback_listen = "<phone tailnet ip>:7382"

# One OpenTelemetry span per tool call (name, policy decision, approval wait, outcome; never arguments or results) to an
# OTLP/HTTP collector over the tailnet. Off without this table. A caller joins a trace by sending `traceparent` and
# `x-run-id` headers, or `_meta.traceparent` and `_meta.run_id` in the call.
# [telemetry]
# otlp_url = "http://100.64.0.4:4318/v1/traces"
# service_name = "tin"
