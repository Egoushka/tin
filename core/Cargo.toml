[package]
name = "tin-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AppFunctions to MCP bridge that runs as the Android shell user"
repository = "https://github.com/Egoushka/tin"

[[bin]]
name = "tin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
roxmltree = "0.20"
