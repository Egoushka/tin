name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub-hosted by default; set the repo variable CI_RUNS_ON=self-hosted to use the box's runner (it needs rustup).
jobs:
  core:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on the runner image, so no third-party action needs pinning.
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.signer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Home's versionCode is the commit count
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/speech/libs
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Rust target for the phone
        run: rustup target add aarch64-linux-android
      # Only main pushes see the signing key, so a PR's workflow edit cannot read it. Without the secrets the build
      # stays debug-signed and `release` is skipped (docs/home-updates.md has the one-time setup).
      - name: Release signing key
        id: key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.TIN_SIGNING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.TIN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::TIN_SIGNING_KEYSTORE_B64 / TIN_SIGNING_PASSWORD are not set; Home and tin are debug-signed and not published"
            exit 0
          fi
          umask 077
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tin.jks"
          mkdir -p ~/.gradle
          {
            echo "tin.signing.storeFile=$RUNNER_TEMP/tin.jks"
            echo "tin.signing.storePassword=$KEY_PASSWORD"
            echo "tin.signing.keyAlias=tin"
            echo "tin.signing.keyPassword=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # build.sh cross-compiles tin into libtin.so and builds :app: release (same key as Home) when the key is
      # present, debug otherwise. The key step runs first so Gradle sees tin.signing.*.
      - name: Build the tin app
        run: ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}" BUILD_TYPE="${{ steps.key.outputs.signed == 'true' && 'release' || 'debug' }}" scripts/build.sh
      # Home's release build is where its real voice engine is wired; debug keeps the scripted one.
      # Home's unit tests include the page 0 screenshots (HomeShotsTest): verifyRoborazziDebug runs them all and compares
      # the shots with the goldens in android/home/src/test/screenshots. A change that is meant to move pixels re-records
      # them (`:home:recordRoborazziDebug`) in the same PR.
      - name: Module tests and Home release build
        working-directory: android
        run: ./gradlew --no-daemon :speech:testDebugUnitTest :home:verifyRoborazziDebug :home:assembleRelease
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-screenshot-diffs
          path: android/home/build/outputs/roborazzi
          if-no-files-found: ignore
      # Home on the Kvaesitso engine: the vendored tree, the licence split, and the APK size and code size it started at.
      - name: Home engine checks
        run: scripts/home-release-check.sh --measure
      - name: Check the APK signers
        id: signer
        run: |
          apk=android/home/build/outputs/apk/release/home-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1); bt=${bt%/}
          echo "version=$("$bt/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" >> "$GITHUB_OUTPUT"
          certs=$("$bt/apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -E 'certificate (DN|SHA-256)'
          if [ "${{ steps.key.outputs.signed }}" = true ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::the release key was set up but Home is still debug-signed"; exit 1
          fi
          # tin's VOICE permission is signature-level: Home and tin must carry one certificate.
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            tin=android/app/build/outputs/apk/release/app-release.apk
            tin_certs=$("$bt/apksigner" verify --print-certs "$tin")
            echo "$tin_certs" | grep -E 'certificate (DN|SHA-256)'
            if echo "$tin_certs" | grep -q 'CN=Android Debug'; then
              echo "::error::the release key was set up but tin is still debug-signed"; exit 1
            fi
            home_sha=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            tin_sha=$(echo "$tin_certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ -z "$home_sha" ] || [ "$home_sha" != "$tin_sha" ]; then
              echo "::error::Home and tin have different signers ($home_sha vs $tin_sha)"; exit 1
            fi
            cp "$tin" android/app/build/outputs/apk/release/tin-release.apk
          fi
      # Without the release key this is signed with the runner's own debug key: `adb uninstall` before installing it.
      - name: Upload Home's release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/home/build/outputs/apk/release/home-release.apk
          if-no-files-found: error
          retention-days: 30
      # Only built on main with the key; PR builds are debug and carry no release artifact for tin.
      - name: Upload the tin app APK
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tin-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/tin-release.apk
          if-no-files-found: error
          retention-days: 30

  # Home's instrumented tests on an API 35 emulator (docs/specs/2026-11-04-home-on-kvaesitso.md, the EMU checks).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Home's versionCode is the commit count
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emulator-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      # The emulator needs KVM, which the runner exposes only to its own group until this rule opens it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Home instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: android/gradlew --no-daemon -p android :home:connectedCheck
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-androidtest-reports
          path: |
            android/home/build/reports/androidTests
            android/home/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14

  # One release per main commit: Obtainium on the phone follows the latest release (docs/home-updates.md).
  release:
    needs: [core, android, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queue, never cancel the running one; a newer main commit publishes after it, so "latest" stays the newest.
    concurrency:
      group: home-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: home-release-${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tin-release-${{ github.sha }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$GITHUB_SHA" ]; then echo "main moved on to $newest; its run publishes"; exit 0; fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already published"; exit 0; fi
          gh release create "v$VERSION" "home-release.apk#home-$VERSION.apk" "tin-release.apk#tin-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Home and tin $VERSION (${GITHUB_SHA::7})" \
            --notes "Commit $GITHUB_SHA. The last number of the version is the commit count on main."
